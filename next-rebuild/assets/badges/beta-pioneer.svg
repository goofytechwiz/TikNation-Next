<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
<title id="title">Beta Pioneer</title><desc id="desc">A luminous portal compass with cyan, violet and gold details.</desc>
<defs>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62f5ff"/><stop offset=".48" stop-color="#a77aff"/><stop offset="1" stop-color="#ffd77a"/></linearGradient>
 <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8ffff"/><stop offset=".45" stop-color="#8cdbff"/><stop offset="1" stop-color="#b78aff"/></linearGradient>
 <radialGradient id="portal"><stop stop-color="#9efaff" stop-opacity=".85"/><stop offset=".55" stop-color="#7555e8" stop-opacity=".55"/><stop offset="1" stop-color="#1b1745" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
