<path d="m48 35 8 13-8 13-8-13Z" fill="url(#core)" stroke="#fff" stroke-width="1.2" filter="url(#glow)"/>
<circle cx="48" cy="48" r="3" fill="#fff"/>
<g fill="#fff4c9" filter="url(#glow)"><path d="m17 25 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/><path d="m76 66 1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5Z"/></g>
