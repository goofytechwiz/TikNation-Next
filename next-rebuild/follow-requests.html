<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b25"><title>TikNation · Follow Requests</title><style>
:root{color-scheme:dark;--cyan:#7deaff;--line:#ffffff20}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(ellipse at 10% 0,#174364,transparent 38%),radial-gradient(ellipse at 95% 90%,#58265f,transparent 35%),#100b25;color:#f8f5ff;font:15px/1.5 system-ui,sans-serif}main{max-width:800px;margin:25px auto}.brand{font-size:11px;letter-spacing:3px;color:var(--cyan);font-weight:900}h1{font-size:clamp(30px,6vw,48px);margin:12px 0}.muted{color:#b9b2cb;font-size:13px}.back{display:inline-block;color:var(--cyan);margin:8px 0 18px}.card{background:linear-gradient(145deg,#111b2eec,#201438ee);border:1px solid var(--line);border-radius:20px;padding:18px;margin:15px 0}.request{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #ffffff12}.request:first-child{border-top:0}.avatar{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,#6fe9ec,#b18aff,#ff75bc);color:#241239;font-weight:900;flex:none}.name{flex:1;min-width:0}.name strong{display:block;overflow-wrap:anywhere}.name small{color:#b9b2cb}.btn{border:1px solid #7deaff55;background:linear-gradient(110deg,#14637c,#6e4095,#a84384);color:white;border-radius:11px;padding:10px 12px;font-weight:800;cursor:pointer}.btn.secondary{background:#ffffff0c;border-color:#ffffff25}.btn.danger{border-color:#ff87b755;background:#5a263e}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{min-height:22px;color:#a8f2d0}.empty{padding:22px;text-align:center;color:#b9b2cb}.hidden{display:none}@media(max-width:520px){body{padding:13px}.request{align-items:flex-start}.actions{flex-direction:column}.btn{padding:9px}}
</style><link rel="stylesheet" href="./tiknation-theme.css?v=20261126-magical-system">
</head><body><main><div class="brand">✦ TIKNATION · COMMUNITY</div><h1>Follow Requests</h1><p class="muted">Review people who want to follow your private account. Accept to let them follow you and see your published posts, or reject their request.</p><a class="back" href="privacy-center.html">← Privacy Center</a>
<section class="card" id="signedOut"><h2>Sign in required</h2><a class="btn" href="index.html">Open TikNation</a></section>
<div id="content" class="hidden"><section class="card"><h2>Incoming requests</h2><div id="incoming"><div class="empty">Loading…</div></div></section><section class="card"><h2>Requests you've sent</h2><div id="outgoing"><div class="empty">Loading…</div></div></section><div class="status" id="status" role="status" aria-live="polite"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script><script>
(async()=>{"use strict";const db=window.supabase.createClient("https://mekzfezaefcimxncklfj.supabase.co","sb_publishable_Cr0ssF3pEz5lE08KwvyacQ_dKC2IUbQ");const $=id=>document.getElementById(id);const s=await db.auth.getSession();const user=s.data.session?.user;if(!user){$("signedOut").classList.remove("hidden");return;}$("signedOut").classList.add("hidden");$("content").classList.remove("hidden");
function status(t){$("status").textContent=t}
function safe(t){return String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function profiles(ids){if(!ids.length)return{};const r=await db.from("profiles").select("id,username,display_name,avatar_url").in("id",ids);if(r.error)throw r.error;return Object.fromEntries((r.data||[]).map(p=>[p.id,p]));}
async function load(){status("Refreshing requests…");try{
const [inR,outR]=await Promise.all([db.from("tiknation_follow_requests").select("id,requester_id,created_at").eq("target_id",user.id).eq("status","pending").order("created_at",{ascending:false}),db.from("tiknation_follow_requests").select("id,target_id,created_at").eq("requester_id",user.id).eq("status","pending").order("created_at",{ascending:false})]);
if(inR.error)throw inR.error;if(outR.error)throw outR.error;
const map=await profiles([...new Set([...(inR.data||[]).map(x=>x.requester_id),...(outR.data||[]).map(x=>x.target_id)])]);
$("incoming").innerHTML=(inR.data||[]).length?inR.data.map(x=>{const p=map[x.requester_id]||{};return '<div class="request"><div class="avatar">'+safe((p.display_name||p.username||"?").slice(0,1).toUpperCase())+'</div><div class="name"><strong>'+safe(p.display_name||p.username||"TikNation member")+'</strong><small>@'+safe(p.username||"unknown")+'</small></div><div class="actions"><button class="btn" data-accept="'+x.id+'">Accept</button><button class="btn danger" data-reject="'+x.id+'">Reject</button></div></div>'}).join(""):'<div class="empty">You have no pending follow requests.</div>';
$("outgoing").innerHTML=(outR.data||[]).length?outR.data.map(x=>{const p=map[x.target_id]||{};return '<div class="request"><div class="avatar">'+safe((p.display_name||p.username||"?").slice(0,1).toUpperCase())+'</div><div class="name"><strong>'+safe(p.display_name||p.username||"TikNation member")+'</strong><small>@'+safe(p.username||"unknown")+' · Pending</small></div><button class="btn secondary" data-cancel="'+x.id+'">Cancel</button></div>'}).join(""):'<div class="empty">You have no outgoing requests.</div>';
status("");
}catch(e){status("Could not load requests: "+e.message)}}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-accept],[data-reject],[data-cancel]");if(!b)return;b.disabled=true;try{if(b.dataset.accept||b.dataset.reject){const id=b.dataset.accept||b.dataset.reject;const response=b.dataset.accept?"accepted":"rejected";const r=await db.rpc("respond_to_tiknation_follow_request",{p_request_id:id,p_response:response});if(r.error)throw r.error;status(response==="accepted"?"Request accepted.":"Request rejected.");}else{const r=await db.from("tiknation_follow_requests").delete().eq("id",b.dataset.cancel).eq("requester_id",user.id).eq("status","pending");if(r.error)throw r.error;status("Request cancelled.");}await load();}catch(err){b.disabled=false;status("Action failed: "+err.message)}});
await load();})();
</script></body></html>
